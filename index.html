<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whistle Dictation</title><style>body{font-family:system-ui;background:#0f172a;color:white;max-width:700px;margin:40px auto;padding:20px}textarea{box-sizing:border-box;width:100%;height:280px;padding:16px;background:#1e293b;color:white;border-radius:12px;font-size:18px}button,select{padding:12px;margin:4px;border-radius:8px}</style></head><body><h1>🎙 Whistle Dictation</h1><p>Speak to transcribe using the Cactus Whistle backend.</p><select id="language"><option value="auto">Auto</option><option value="en">English</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option></select><button id="start">Start</button><button id="stop" disabled>Stop</button><button id="clear">Clear</button><p id="status">Ready</p><textarea id="output" placeholder="Your speech appears here"></textarea><script>
let ctx,stream,src,proc,timer,active=false,parts=[],queue=Promise.resolve();const el=id=>document.getElementById(id);
function wav(a){let b=new ArrayBuffer(44+a.length*2),v=new DataView(b),s=(p,t)=>{for(let i=0;i<t.length;i++)v.setUint8(p+i,t.charCodeAt(i))};s(0,'RIFF');v.setUint32(4,b.byteLength-8,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,a.length*2,true);for(let i=0;i<a.length;i++)v.setInt16(44+i*2,Math.max(-32768,Math.min(32767,Math.round(a[i]*32767))),true);return new Blob([b],{type:'audio/wav'})}
function flush(){if(!parts.length)return;let p=parts;parts=[];let size=p.reduce((n,x)=>n+x.length,0),all=new Float32Array(size),offset=0;for(let x of p){all.set(x,offset);offset+=x.length}let n=Math.round(size*16000/ctx.sampleRate),samples=new Float32Array(n);for(let i=0;i<n;i++){let q=i*ctx.sampleRate/16000,j=Math.floor(q),f=q-j;samples[i]=(all[j]||0)*(1-f)+(all[j+1]||0)*f}let audio=wav(samples),language=el('language').value;queue=queue.then(async()=>{el('status').textContent='Transcribing...';try{let form=new FormData();form.append('audio',audio,'speech.wav');form.append('language',language);let r=await fetch('/transcribe',{method:'POST',body:form});if(!r.ok)throw Error(await r.text());let data=await r.json();if(data.text)el('output').value+=(el('output').value?' ':'')+data.text;el('status').textContent=active?'Listening':'Stopped'}catch(e){el('status').textContent='Error: '+e.message}})}
el('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new AudioContext();src=ctx.createMediaStreamSource(stream);proc=ctx.createScriptProcessor(4096,1,1);proc.onaudioprocess=e=>{if(active)parts.push(new Float32Array(e.inputBuffer.getChannelData(0)))};src.connect(proc);proc.connect(ctx.destination);active=true;el('start').disabled=true;el('stop').disabled=false;el('status').textContent='Listening';timer=setInterval(flush,4000)}catch(e){el('status').textContent=e.message}};
el('stop').onclick=async()=>{active=false;clearInterval(timer);flush();proc.disconnect();src.disconnect();stream.getTracks().forEach(t=>t.stop());await queue;await ctx.close();el('start').disabled=false;el('stop').disabled=true;el('status').textContent='Stopped'};el('clear').onclick=()=>el('output').value='';
</script></body></html>
